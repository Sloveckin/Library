name: main.yml

on:
  push:
    branches:
      - master

permissions:
  contents: write

env:
  REGISTRY: ${{ secrets.YC_REGISTRY }}

jobs:
  sonar-analysis:
    needs: [test-client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install SonarScanner
        run: |
          curl -sSLo sonar.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip sonar.zip
          echo "$PWD/sonar-scanner-5.0.1.3006-linux/bin" >> $GITHUB_PATH

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Test + coverage
        run: |
          cd server
          go test ./... -coverprofile=coverage.out

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Client test + coverage
        run: |
          cd devops-client-app
          npm install
          npm test -- --coverage --watchAll=false

      - name: Sonar Scan
        run: |
          sonar-scanner \
            -Dsonar.projectKey=library-app \
            -Dsonar.sources=. \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.go.coverage.reportPaths=server/coverage.out \
            -Dsonar.javascript.lcov.reportPaths=devops-client-app/coverage/lcov.info \
            -Dsonar.qualitygate.wait=true

  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Test
        working-directory: server
        run: go test ./... -coverprofile=coverage.out

  test-client:
    needs: [test-server]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devops-client-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Test
        run: npm test -- --coverage --watchAll=false

  build-server:
    needs: [sonar-analysis]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: server

  build-client:
    needs: [build-server]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devops-client-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build

  build-server-docker:
    needs: [build-client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login
        run: |
          docker login \
            --username oauth \
            --password ${{ secrets.YC_TOKEN }} \
            cr.yandex

      - name: Build server image
        run: docker build -t $REGISTRY/server:${{ github.sha }} ./server

      - name: Push server image
        run: docker push $REGISTRY/server:${{ github.sha }}

  build-client-docker:
    needs: [build-client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login
        run: |
          docker login \
            --username oauth \
            --password ${{ secrets.YC_TOKEN }} \
            cr.yandex

      - name: Build client image
        run: docker build -t $REGISTRY/client:${{ github.sha }} ./devops-client-app

      - name: Push client image
        run: docker push $REGISTRY/client:${{ github.sha }}

  update-manifests:
    needs:
      - build-server-docker
      - build-client-docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update image tags in manifests
        run: |
          sed -i "s|image: cr.yandex/crpiegiuj22g2courr8t/server:.*|image: $REGISTRY/server:${{ github.sha }}|" minikube/server-deploy.yaml
          sed -i "s|image: cr.yandex/crpiegiuj22g2courr8t/client:.*|image: $REGISTRY/client:${{ github.sha }}|" minikube/client-deploy.yaml

      - name: Commit and push manifest changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add minikube/server-deploy.yaml minikube/client-deploy.yaml

          git diff --cached --quiet && exit 0

          git commit -m "Update image tags to ${{ github.sha }}"
          git push

  notify:
    runs-on: ubuntu-latest
    needs:
      - sonar-analysis
      - build-server
      - build-client
      - build-server-docker
      - build-client-docker
      - update-manifests
    if: always()

    steps:
      - name: Send Telegram notification
        run: |
          if [[ "${{ needs.sonar-analysis.result }}" == "success" && \
                "${{ needs.build-server.result }}" == "success" && \
                "${{ needs.build-client.result }}" == "success" && \
                "${{ needs.build-server-docker.result }}" == "success" && \
                "${{ needs.build-client-docker.result }}" == "success" && \
                "${{ needs.update-manifests.result }}" == "success" ]]; then
            STATUS="SUCCESS"
          else
            STATUS="FAILED"
          fi

          MESSAGE="CI/CD Pipeline: $STATUS

          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Commit: ${{ github.sha }}

          Workflow: ${{ github.workflow }}"

          curl -s -X POST \
            https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="$MESSAGE"