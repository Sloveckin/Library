name: main.yml
on:
  push

env:
  REGISTRY: ${{ secrets.YC_REGISTRY }}
  
jobs:
  build-server:
    needs: [test-server]
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: set up go
        uses: actions/setup-go@v6
        with:
            working-directory: server
            go-version: '1.25'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
            working-directory: server

  test-server:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: set up go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: test
        working-directory: server
        run: go test ./internal/service/author/

  build-client:
    needs: [test-client]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devops-client-app 
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install dependencies
        run: npm install
      - name: build
        run: npm run build
        
  test-client:
    needs: [build-server-docker]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devops-client-app 
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install dependencies
        run: npm install
      - name: test
        run: npm test -- --coverage --watchAll=false
    
  build-server-docker:
    needs: [build-server]
    runs-on: ubuntu-latest
    steps:
      - name: build
        run: docker build -t $REGISTRY/server:latest ./server

      - name: push
        run: docker push $REGISTRY/server:latest
  
  build-client-docker:
    needs: [build-client]
    runs-on: ubuntu-latest
    steps:
      - name: build
        run: docker build -t $REGISTRY/client:latest ./devops-client-app

      - name: push
        run: docker push $REGISTRY/client:latest