version: "2.2"
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: library
    ports:
      - "5432:5432"
    volumes:
      - ./db/postgresql:/docker-entrypoint-initdb.d/
  
  server:
    build: ./server
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: 1234
      DB_NAME: library
      ENV: prod
      STORAGE_URL: postgresql://postgres:1234@db:5432/library
      HTTP_SERVER_ADDRESS: 0.0.0.0:8080
      HTTP_SERVER_TIMEOUT: 10s
      HTTP_SERVER_IDLE_TIMEOUT: 30s

  client:
    build: ./devops-client-app
    restart: always
    depends_on:
      - server
    environment:
      REACT_APP_API_URL: /api

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server

volumes:
  db_data:
