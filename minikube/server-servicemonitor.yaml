apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: server-metrics
  namespace: monitoring
  labels:
    release: monitoring

spec:
  namespaceSelector:
    matchNames:
      - default

  selector:
    matchLabels:
      app: server

  endpoints:
    - port: http
      path: /metrics
      interval: 5s
